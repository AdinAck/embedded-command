[package]
name = "serac"
version = "0.5.0"
edition = "2024"
description = "A static, modular, and light-weight serialization framework."
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/adinack/embedded-command"

[dependencies]
macros = { package = "embedded-command-macros", path = "../macros", version = "0.5.1" }
fill-array = "0.2.1"

# for binary
panic-halt = { version = "1.0.0", optional = true }
cortex-m = { version = "0.7.7", optional = true }
cortex-m-rt = { version = "0.7.3", optional = true }
defmt = { version = "0.3.10", optional = true }
heapless = { version = "0.9.3", optional = true }
derive_more = { version = "2.1.1", default-features = false, features = ["deref", "deref_mut"] }
ters = "0.2.1"

[dev-dependencies]
itertools = { version = "0.15.0", default-features = false }

[features]
binary = ["dep:panic-halt", "dep:cortex-m", "dep:cortex-m-rt"]
defmt = ["dep:defmt"]
heapless = ["dep:heapless"]

[[bin]]
name = "asm"
bench = false
test = false
required-features = ["binary"]
